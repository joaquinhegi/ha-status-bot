schema: spec-driven

context: |
  Tech stack: Node.js 20 (ESM, "type": "module"), no framework.
  Domain: Home Assistant add-on — Telegram bot reporting HA entity status.
  Architecture: src/index.js (bootstrap) -> haClient.js (HA REST client)
    -> formatter.js (status formatting) -> telegram.js (bot wiring).
  Testing: built-in node:test + node:assert/strict, one *.test.js per module.
  Style: no linter/formatter configured; plain modern JS, Spanish log strings.
  Packaging: Dockerfile (node:20-alpine), config.yaml/repository.yaml (HA add-on).

strict_tdd: true

testing:
  runner: "node --test tests/*.test.js"
  coverage: "node --test --experimental-test-coverage tests/*.test.js"
  framework: "node:test (built-in)"
  layers:
    unit: true
    integration: false
    e2e: false
  quality:
    linter: none
    type_checker: none
    formatter: none

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag any hardcoded secret or credential found in scope as a blocking risk
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Document HA Supervisor API and Telegram API integration points explicitly
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns (plain ESM, no framework)
      - Never hardcode tokens/secrets; read from options.json or environment
    tdd: true
    test_command: "npm test"
  verify:
    test_command: "npm test"
    build_command: "docker build ."
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
