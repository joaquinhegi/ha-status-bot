name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Nueva versión (ej: 1.2.0)"
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Validar formato de versión
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Formato inválido. Usa X.Y.Z (ej: 1.2.0)"
            exit 1
          fi

      - name: Actualizar versión en package.json
        run: |
          sed -i 's/"version": ".*"/"version": "${{ inputs.version }}"/' package.json

      - name: Actualizar versión en config.yaml
        run: |
          sed -i 's/^version: ".*"/version: "${{ inputs.version }}"/' config.yaml

      - name: Crear rama, commit y PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bump/v${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json config.yaml
          git commit -m "bump: v${{ inputs.version }}"
          git push origin "$BRANCH"
          gh pr create \
            --title "bump: v${{ inputs.version }}" \
            --body "Actualiza versión a **${{ inputs.version }}** en \`package.json\` y \`config.yaml\`.\n\nAl mergear esta PR, se creará automáticamente el tag \`v${{ inputs.version }}\`." \
            --base main \
            --head "$BRANCH"

  tag:
    needs: bump
    runs-on: ubuntu-latest
    if: false  # Se activa manualmente después del merge, ver workflow create-tag

    steps:
      - run: echo "Tag se crea con el workflow on-merge"
