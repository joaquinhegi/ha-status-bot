name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (e.g. 1.2.0)"
        required: true
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      # The input reaches the shell through the environment, never through
      # ${{ }} interpolation inside a run block. Interpolation would splice the
      # raw value into the script before the format check below could reject it.
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid format. Use X.Y.Z (e.g. 1.2.0)"
            exit 1
          fi

      # Without this the run reaches `git commit`, finds an unchanged tree, and
      # dies on "nothing to commit" with exit code 1 — an error that says
      # nothing about what the operator actually got wrong.
      - name: Reject a version that is already declared
        env:
          VERSION: ${{ inputs.version }}
        run: |
          CURRENT=$(sed -n 's/^version: "\(.*\)"$/\1/p' config.yaml)

          if [ "$CURRENT" = "$VERSION" ]; then
            echo "config.yaml already declares $VERSION, so there is nothing to bump."
            echo "The release tag is created by the Create Release Tag workflow when"
            echo "config.yaml reaches main — it does not need this workflow."
            echo "Run this workflow with the NEXT version instead."
            exit 1
          fi

          echo "Bumping $CURRENT to $VERSION"

      - name: Update the version in package.json and config.yaml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          sed -i "s/^version: \".*\"/version: \"$VERSION\"/" config.yaml

          # Guard against the file format drifting away from what the patterns
          # above expect: a silent no-op here would fail later as the same
          # opaque "nothing to commit".
          if ! git diff --quiet -- package.json config.yaml; then
            exit 0
          fi

          echo "Neither package.json nor config.yaml changed."
          echo "Their version fields no longer match the patterns this workflow edits."
          exit 1

      - name: Open the bump pull request
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="bump/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package.json config.yaml
          git commit -m "bump: v$VERSION"
          git push origin "$BRANCH"
          gh pr create \
            --title "bump: v$VERSION" \
            --body "$(printf 'Sets the version to **%s** in `package.json` and `config.yaml`.\n\nMerging this pull request creates the `v%s` tag automatically.\n\nUpdate `CHANGELOG.md` in the same release if this version carries user-visible changes.' "$VERSION" "$VERSION")" \
            --base main \
            --head "$BRANCH"
