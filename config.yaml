name: HA Status Bot
version: "2.0.4"
slug: ha_status_bot
description: Telegram bot to query Home Assistant lights, sensors, doors, batteries and temperatures
url: "https://github.com/joaquinhegi/ha-status-bot"

arch:
  - aarch64
  - amd64

startup: services
boot: auto
init: false

homeassistant_api: true

# camera.record and camera.snapshot write into Home Assistant media folder.
# Mapping it here lets the add-on read those files off the mount; fetching them
# over HTTP is answered 403, because Home Assistant serves media through signed
# media-source URLs rather than bearer tokens. Read-only: Home Assistant writes
# the files, the add-on only reads them.
map:
  - type: media
    read_only: true

options:
  telegram_bot_token: ""
  allowed_chat_ids: []
  low_battery_threshold_percent: 20

schema:
  telegram_bot_token: password
  allowed_chat_ids:
    - str
  low_battery_threshold_percent: int(0,100)