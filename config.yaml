name: HA Status Bot
version: "2.0.4"
slug: ha_status_bot
description: Telegram bot to query Home Assistant lights, sensors, doors, batteries and temperatures
url: "https://github.com/joaquinhegi/ha-status-bot"

arch:
  - aarch64
  - amd64

startup: services
boot: auto
init: false

homeassistant_api: true

options:
  telegram_bot_token: ""
  allowed_chat_ids: []
  low_battery_threshold_percent: 20

schema:
  telegram_bot_token: password
  allowed_chat_ids:
    - str
  low_battery_threshold_percent: int(0,100)